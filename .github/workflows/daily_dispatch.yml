name: CAT 2026 Daily Master Set Cloud Dispatch

on:
  schedule:
    # 08:00 AM IST = 02:30 UTC
    - cron: '30 2 * * *'
    # 20:00 PM IST = 14:30 UTC
    - cron: '30 14 * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'Dispatch action (morning or evening)'
        required: true
        default: 'morning'
        type: choice
        options:
          - morning
          - evening

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Daily Dispatch
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: 'gemini-3.5-flash-lite'
        run: |
          # Determine morning or evening if run via cron
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python telegram_bot/dispatch_cli.py ${{ inputs.action }}
          else
            HOUR=$(date -u +%H)
            if [ "$HOUR" -lt 8 ]; then
              python telegram_bot/dispatch_cli.py morning
            else
              python telegram_bot/dispatch_cli.py evening
            fi
          fi

      - name: Commit Updated Progress (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: sync study progress tracker [skip ci]"
          git push || true